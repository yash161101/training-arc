name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "INVITE_CODE=ci-invite" > .dev.vars
      - run: npx wrangler d1 migrations apply training-arc --local
      - name: Run the browser check
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 2; done
          INVITE=ci-invite node checks/e2e.mjs
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-shots
          path: |
            checks/shots/
            wrangler.log
          retention-days: 14
